[defaults]
inventory = inventory/aws_ec2.yml
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
callback_result_format = yaml
# SSM round-trips are slow; pipelining cuts the number of file transfers through S3.
forks = 10
timeout = 60

[connection]
pipelining = True

[inventory]
enable_plugins = amazon.aws.aws_ec2
